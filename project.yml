name: FlashCount
# 本机私有覆盖（如 Release 签名的 DEVELOPMENT_TEAM）放在 project.local.yml，
# 该文件已被 gitignore。
#
# 注意：XcodeGen 的 include 无法声明为可选（`optional: true` 会被静默忽略），
# 文件缺失时 `xcodegen generate` 会直接失败。请用 scripts/generate-project.sh
# 生成工程——它会在缺失时补一个只有注释的占位文件。
include:
  - path: project.local.yml
options:
  bundleIdPrefix: com.flashcount
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: 8
targets:
  FlashCount:
    type: application
    platform: iOS
    sources:
      - path: FlashCount
    info:
      path: FlashCount/Info.plist
      properties:
        CFBundleDisplayName: FlashCount
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIcon-Forest:
              CFBundleIconFiles:
                - AppIcon-Forest
              UIPrerenderedIcon: false
            AppIcon-Ocean:
              CFBundleIconFiles:
                - AppIcon-Ocean
              UIPrerenderedIcon: false
            AppIcon-Violet:
              CFBundleIconFiles:
                - AppIcon-Violet
              UIPrerenderedIcon: false
            AppIcon-Rose:
              CFBundleIconFiles:
                - AppIcon-Rose
              UIPrerenderedIcon: false
            AppIcon-Graphite:
              CFBundleIconFiles:
                - AppIcon-Graphite
              UIPrerenderedIcon: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.flashcount.app
            CFBundleURLSchemes:
              - flashcount
        NSFaceIDUsageDescription: 用于在您确认后显示收入、资产和其他隐私金额
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashcount.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FlashCount/FlashCount.entitlements
      configs:
        Debug:
          DEVELOPMENT_TEAM: ""
        Release:
          PROVISIONING_PROFILE_SPECIFIER: ""
  FlashCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlashCountTests
    dependencies:
      - target: FlashCount
  FlashCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FlashCountUITests
    dependencies:
      - target: FlashCount
