name: FlashCount
options:
  bundleIdPrefix: com.flashcount
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: 3
targets:
  FlashCount:
    type: application
    platform: iOS
    sources:
      - path: FlashCount
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用于解锁工资、资金池、储蓄目标和分期账单等隐私金额"
        INFOPLIST_KEY_CFBundleDisplayName: "FlashCount"
        PRODUCT_BUNDLE_IDENTIFIER: com.flashcount.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          DEVELOPMENT_TEAM: ""
        Release:
          DEVELOPMENT_TEAM: "66WCCRKRLC"
          PROVISIONING_PROFILE_SPECIFIER: ""
  FlashCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlashCountTests
    dependencies:
      - target: FlashCount
