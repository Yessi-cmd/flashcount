name: Feature request
description: Suggest an improvement for FlashCount.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请避免在描述中包含真实账本或其他个人数据。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明当前流程中遇到的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 说明希望看到的行为或界面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私影响
      options:
        - label: 此建议不要求上传或共享用户账本数据。
          required: true
